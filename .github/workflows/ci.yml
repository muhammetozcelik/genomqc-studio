name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  python-tests:
    name: Python 3.12 tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run Python test suite
        run: python -m pytest -q -m "not integration"

  deseq2-integration:
    name: DESeq2 integration test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create reproducible analysis environment
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment.yml
          cache-environment: true

      - name: Verify analysis environment
        shell: micromamba-shell {0}
        run: |
          python --version
          Rscript --version
          Rscript -e 'stopifnot(requireNamespace("DESeq2", quietly = TRUE))'

      - name: Run DESeq2 integration test
        shell: micromamba-shell {0}
        run: python -m pytest -q -m integration